[project]
name = "makelaar-mcp"
version = "0.2.1"
description = "Your AI makelaar — MCP server for Dutch house hunting on funda.nl"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0,<2",
    "pyfunda>=3.1.5",
]

[project.scripts]
makelaar-mcp = "makelaar_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/makelaar_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
